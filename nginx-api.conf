# /etc/nginx/sites-available/api.kenyadebtcounter.or.ke
# Nginx reverse proxy for the Plumber R API
#
# ############################################################################
# ☠️  STALE — DO NOT DEPLOY UNEDITED. Kept as a record of the original intent.
#
# The Access-Control-Allow-Origin below is set to the NON-www origin. The site
# runs on www, so applying this file blocks every browser API call: the
# dashboard loads but shows no data. Production currently sends "*".
#
# Use  deploy/nginx-api.conf  instead. Verified against production 2026-08-06.
# ############################################################################
# ============================================================
# KENYA NATIONAL DEBT COUNTER
# API REVERSE PROXY
# ============================================================
#
# Purpose:
# Securely expose the Plumber API
# over HTTPS.
#
# Flow:
#
# Browser
#    ↓
# Nginx
#    ↓
# Plumber API
#    ↓
# Supabase
#
# Features:
# - SSL Termination
# - CORS Management
# - Security Headers
# - Request Forwarding
#
# ============================================================

server {
    listen 80;
    server_name api.kenyadebtcounter.or.ke;

    # Let Certbot manage HTTPS redirect after SSL setup
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.kenyadebtcounter.or.ke;

    # SSL — Certbot will fill these in automatically
    ssl_certificate     /etc/letsencrypt/live/api.kenyadebtcounter.or.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kenyadebtcounter.or.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # CORS headers (nginx level, belt-and-suspenders with plumber)
    add_header Access-Control-Allow-Origin  "https://kenyadebtcounter.or.ke" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Handle preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Proxy to Plumber
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts (AI endpoint can be slow)
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }
}
