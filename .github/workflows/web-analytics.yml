name: Readership (Vercel Web Analytics)

# Three times a day, 07:37, 13:37 and 19:37 Nairobi (04:37, 10:37, 16:37 UTC):
# copies the last 3 days of the site's Vercel Web Analytics, plus today so far,
# into Supabase (web_daily, web_daily_breakdown), so the About page's visitor
# numbers move during the day and readership history is kept permanently
# whatever the Vercel plan's reporting window. Each run REPLACES the rows for
# those days, so Supabase keeps one row per day however often this runs; the
# 07:37 run settles yesterday's final figure.
# Each run then rebuilds this month's PDF visitor report, to date (day 1 to
# now, compared with the same days of last month), and puts it in Supabase
# Storage (reports/readers/<month>.pdf and latest.pdf), which the site's
# download buttons link to. On the 1st and 2nd it also rebuilds last month's
# report with the month's final figures.
#
# By hand (Actions -> this workflow -> Run workflow):
#   days     how many past days to (re)fetch; use 31 for the first run
#   report   also build and upload the PDF report (for "month", default this month to date)
#
# Needs repository secrets VERCEL_TOKEN (Vercel -> Account Settings -> Tokens),
# SUPABASE_URL and SUPABASE_SERVICE_ROLE (already set for the CBK pipelines).
on:
  schedule:
    - cron: "37 4 * * *"
    - cron: "37 10 * * *"
    - cron: "37 16 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to fetch (31 for the first run)"
        type: number
        default: 3
      report:
        description: "Also build and upload the PDF report"
        type: boolean
        default: false
      month:
        description: "Report month as YYYY-MM (blank = this month to date)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write   # to open an issue when a scheduled run fails

concurrency:
  group: web-analytics
  cancel-in-progress: false

# All dates and times in these scripts are Nairobi time (EAT), as on the site.
# (Cron schedules above are still written in UTC: GitHub always reads them as UTC.)
env:
  TZ: Africa/Nairobi

jobs:
  readership:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-analytics
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: kenyadebtcounter
      VERCEL_TEAM: iea-kenya
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-analytics/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Copy Vercel Web Analytics into Supabase
        env:
          DAYS: ${{ inputs.days || 3 }}
        run: node collect.mjs

      - name: Build and upload the PDF visitor report
        if: github.event_name == 'schedule' || inputs.report
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          month="${{ inputs.month }}"
          if [ -n "$month" ]; then
            node build-report.mjs --month "$month" --out report.pdf --upload
          else
            # 1st and 2nd: finalise last month's report first (its last day is now settled).
            if [ "$(date +%-d)" -le 2 ]; then
              node build-report.mjs --month "$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m)" --out report-last-month.pdf --upload
            fi
            # This month to date; uploaded last, so it is latest.pdf (skipped if no data yet).
            node build-report.mjs --out report.pdf --upload
          fi

      - name: Keep the PDF with the run
        if: github.event_name == 'schedule' || inputs.report
        uses: actions/upload-artifact@v4
        with:
          name: visitor-report
          path: web-analytics/report*.pdf
          if-no-files-found: ignore
          retention-days: 30

      - name: Open an issue if this run failed
        if: failure() && github.event_name == 'schedule'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled run failed: ${{ github.workflow }}"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Failed again on $(date '+%Y-%m-%d %H:%M EAT'): $url"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" \
              --body "The scheduled run on $(date '+%Y-%m-%d %H:%M EAT') failed: $url. Close this issue once it is fixed."
          fi
