name: GDP & population sheet sync

# Runs every Monday 08:07 Nairobi time (05:07 UTC) -- about an hour after the
# separate weekly scheduled task that refreshes the "gdp"/"population" tabs
# of the IEA Kenya Google Sheet from KNBS (Mondays 07:03 Nairobi / 04:03 UTC),
# so this workflow always picks up that week's rebuilt series rather than
# racing it. Off the hour on purpose: GitHub delays :00 jobs, and each
# scheduled job gets its own 5-minute slot so none hit Supabase together.
# Slot plan (Nairobi): Mon 07:03 sheet refresh | 08:07 GDP & population |
# 08:12 forex | 08:17 WACD | 08:22 finance | Fri 16:07 CBK debt watch.
# Also runnable by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write   # to open an issue when a scheduled run fails

concurrency:
  group: gdp-population-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/R
          key: r-${{ runner.os }}-gdp-pop-${{ hashFiles('df_gdp.R', 'df_pop.R') }}
          restore-keys: |
            r-${{ runner.os }}-gdp-pop-

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::lubridate
            any::httr
            any::jsonlite
            any::googlesheets4
            any::gargle

      # gsheets.json is never committed to the repo (see .gitignore) -- it's
      # written fresh from the GSHEET_SERVICE_ACCOUNT secret on every run,
      # the same pattern quarterly-macro-debt-report's render-pdf.yml uses.
      # Add this secret with:
      #   base64 -i gsheets.json | pbcopy   (macOS)
      # then paste it into Settings -> Secrets and variables -> Actions ->
      # New repository secret, named GSHEET_SERVICE_ACCOUNT. It's the same
      # service-account key already shared as Viewer on the sheet
      # (iea-kenya-ci-reports@iea-pipeline.iam.gserviceaccount.com) -- no
      # need to create a new one or re-share the sheet.
      - name: Write Google Sheets service account to file
        run: echo "${{ secrets.GSHEET_SERVICE_ACCOUNT }}" | base64 --decode > gsheets.json

      - name: Update Supabase (df_gdp.R)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: Rscript df_gdp.R

      - name: Update Supabase (df_pop.R)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: Rscript df_pop.R

      # Belt-and-braces: gsheets.json only ever exists on the runner's disk,
      # which is destroyed after the job anyway, but there's no reason to
      # leave a service-account private key sitting around for the rest of
      # the job if a later step is ever added.
      - name: Remove service account file
        if: always()
        run: rm -f gsheets.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### GDP & population sheet sync"
            echo "- Ran: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- df_gdp.R and df_pop.R both read the Google Sheet's gdp/population"
            echo "  tabs and upsert df_gdp/df_pop + df_gdp_metrics/df_pop_metrics."
            echo "- See the step logs above for each script's pipeline summary."
          } >> "$GITHUB_STEP_SUMMARY"

      # Scheduled runs only: open an issue (or comment on the open one) so a
      # failure is noticed. GitHub emails the repository's watchers about it.
      - name: Open an issue if this run failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled run failed: ${{ github.workflow }}"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Failed again on $(date -u '+%Y-%m-%d %H:%M UTC'): $url"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" \
              --body "The scheduled run on $(date -u '+%Y-%m-%d %H:%M UTC') failed: $url. Close this issue once it is fixed."
          fi
