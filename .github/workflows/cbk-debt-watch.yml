name: CBK public debt watch

# Every Friday 16:07 Nairobi time (13:07 UTC) -- off the hour so GitHub starts it on time. Also runnable by hand from the
# Actions tab ("Run workflow"), with an option to force a Supabase update.
on:
  schedule:
    - cron: "7 13 * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run df_debt.R even if the CBK file hasn't changed"
        type: boolean
        default: false

permissions:
  contents: write   # to commit watch/public_debt.state after a successful update
  issues: write     # to open an issue when a scheduled run fails

concurrency:
  group: cbk-debt-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check CBK for a new Public Debt file
        id: check
        run: bash watch/check_cbk.sh public_debt 'Public(%20| )Debt\.csv'

      - name: Set up R
        if: steps.check.outputs.changed == 'true' || inputs.force
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        if: steps.check.outputs.changed == 'true' || inputs.force
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::purrr
            any::lubridate
            any::zoo
            any::forecast
            any::readr
            any::httr
            any::jsonlite

      - name: Update Supabase (df_debt.R)
        if: steps.check.outputs.changed == 'true' || inputs.force
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: Rscript df_debt.R

      # Only remember the new file once Supabase was updated successfully, so a
      # failed run is retried next week (and GitHub emails you about the failure).
      - name: Record new file version
        if: steps.check.outputs.changed == 'true'
        run: |
          mv watch/public_debt.state.new watch/public_debt.state
          git config user.name  "cbk-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watch/public_debt.state
          git commit -m "CBK Public Debt updated: ${{ steps.check.outputs.latest }}"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### CBK public debt watch"
            echo "- File: ${{ steps.check.outputs.url }}"
            echo "- Changed: ${{ steps.check.outputs.changed }}"
            echo "- Latest year,month: ${{ steps.check.outputs.latest }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Scheduled runs only: open an issue (or comment on the open one) so a
      # failure is noticed. GitHub emails the repository's watchers about it.
      - name: Open an issue if this run failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled run failed: ${{ github.workflow }}"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Failed again on $(date -u '+%Y-%m-%d %H:%M UTC'): $url"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" \
              --body "The scheduled run on $(date -u '+%Y-%m-%d %H:%M UTC') failed: $url. Close this issue once it is fixed."
          fi
