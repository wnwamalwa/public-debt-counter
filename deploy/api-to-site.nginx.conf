# /etc/nginx/sites-available/api.kenyadebtcounter.or.ke
#
# Point api.kenyadebtcounter.or.ke at the website (kenyadebtcounter.vercel.app)
# instead of the old Plumber R API, which still serves October 2026 figures
# (KSh 36,125/sec, about KSh 100 bn below the site). After this, every
# /api/... request on this host returns exactly what the site returns.
#
# Two ways to do it; pick ONE.
#
# A. DNS (simplest, no server needed). In the Vercel project: Settings ->
#    Domains -> add api.kenyadebtcounter.or.ke. Vercel then shows the record to
#    set. In DigitalOcean (the domain's DNS: Networking -> Domains ->
#    kenyadebtcounter.or.ke) change the A record for "api" from
#    159.89.248.211 to the address Vercel shows (usually 76.76.21.21).
#    Vercel issues the certificate itself. The droplet's Plumber service can
#    then be stopped: sudo systemctl disable --now debtcounter-api
#
# B. Keep the droplet (159.89.248.211) and make nginx forward to the site.
#    Replace this host's server blocks with the ones below (keep the
#    certificate paths that certbot already created), then:
#      sudo nginx -t && sudo systemctl reload nginx
#      sudo systemctl disable --now debtcounter-api     # the old R API
#
# Either way, check afterwards:
#   curl -s https://api.kenyadebtcounter.or.ke/api/debt/summary | head -c 300
# and the daily health check (watch/check_health.py) stops reporting a mismatch.
#
# Note: the old API wrapped every value in a one-item list ("total": [1.3e13]);
# the site returns plain values ("total": 1.3e13). Anything still reading the
# old format needs `value[0]` -> `value`. Endpoints only the old API had
# (/api/simulate, /api/ai/*, /api/visitor/*) will answer 404.

server {
    listen 80;
    listen [::]:80;
    server_name api.kenyadebtcounter.or.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kenyadebtcounter.or.ke;

    ssl_certificate     /etc/letsencrypt/live/api.kenyadebtcounter.or.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kenyadebtcounter.or.ke/privkey.pem;

    location / {
        proxy_pass https://kenyadebtcounter.vercel.app;
        proxy_set_header Host kenyadebtcounter.vercel.app;
        proxy_ssl_server_name on;
        proxy_ssl_name kenyadebtcounter.vercel.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        # The site sets its own CORS and cache headers; pass them through.
    }
}
